name: tmp-fnet-identity-endpoints
on:
  push:
    branches: [tmp-fnet-filter-probe]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test internal fund ID identity resolution
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,re,pathlib
          s=requests.Session(); base='https://fnet.bmfbovespa.com.br/fnet/publico/'
          s.get(base+'pesquisarGerenciadorDocumentosCVM?tipoFundo=1',timeout=90).raise_for_status()
          # Official listarFundos result: id 19370 = BTG HOTEL FI / BTG HOTEIS FII (non-holdout probe)
          p=dict(d=0,s=0,l=20,tipoFundo=1,administrador='',idFundo='19370',idCategoriaDocumento=0,idTipoDocumento=0,idEspecieDocumento=0,situacao='',cnpj='',cnpjFundo='',dataReferencia='',dataInicial='01/01/2019',dataFinal='31/12/2019',idModalidade='',palavraChave='')
          r=s.get(base+'pesquisarGerenciadorDocumentosDados',params=p,timeout=90); r.raise_for_status(); j=r.json()
          out={'recordsFiltered':j.get('recordsFiltered'),'rows':j.get('data',[])[:5]}
          # Also inspect rendered first document for explicit CNPJ
          if out['rows']:
            did=out['rows'][0]['id']
            h=s.get(base+'exibirDocumento',params={'id':did},timeout=90); h.raise_for_status()
            text=re.sub(r'<[^>]+>',' ',h.text)
            text=re.sub(r'\s+',' ',text)
            out['document_id']=did
            out['candidates_cnpj']=sorted(set(re.findall(r'\d{2}[\.\s]?\d{3}[\.\s]?\d{3}[\s/]?[/]?\d{4}[-\s]?\d{2}',text)))[:20]
            out['html_has_cnpj_label']=bool(re.search(r'CNPJ\s+(?:do\s+)?Fundo',text,re.I))
            pathlib.Path('out/document.html').write_text(h.text,encoding='utf-8',errors='ignore')
          pathlib.Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          sha256sum out/result.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fnet-internal-id-resolution
          path: out
          retention-days: 1
