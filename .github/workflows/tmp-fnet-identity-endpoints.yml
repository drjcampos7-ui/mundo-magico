name: tmp-fnet-identity-endpoints
on:
  push:
    branches: [tmp-fnet-filter-probe]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official listarFundos identity endpoint
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,pathlib,json
          s=requests.Session()
          base='https://fnet.bmfbovespa.com.br/fnet/publico/'
          page=s.get(base+'pesquisarGerenciadorDocumentosCVM?tipoFundo=1',timeout=90)
          page.raise_for_status()
          tests=[]
          for term in ['', 'BTG', 'FUNDO']:
            for pg in [1,2]:
              try:
                r=s.get(base+'listarFundos',params={'term':term,'page':pg,'idTipoFundo':1,'idAdm':0,'paraCerts':'false'},timeout=90)
                rec={'term':term,'page':pg,'status':r.status_code,'content_type':r.headers.get('content-type'),'text_prefix':r.text[:1000]}
                if r.ok:
                  try: rec['json']=r.json()
                  except Exception as e: rec['json_error']=str(e)
                tests.append(rec)
              except Exception as e:
                tests.append({'term':term,'page':pg,'error':type(e).__name__+': '+str(e)})
          pathlib.Path('out/listarFundos.json').write_text(json.dumps(tests,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          sha256sum out/listarFundos.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fnet-listar-fundos-probe
          path: out
          retention-days: 1
