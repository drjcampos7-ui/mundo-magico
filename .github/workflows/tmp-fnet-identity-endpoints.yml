name: tmp-fnet-identity-endpoints
on:
  push:
    branches: [tmp-fnet-filter-probe]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Fundos.NET public scripts for identity endpoints
        run: |
          set -euo pipefail
          mkdir -p out/js
          python - <<'PY'
          import requests,re,urllib.parse,pathlib,json
          sess=requests.Session()
          base='https://fnet.bmfbovespa.com.br'
          url=base+'/fnet/publico/pesquisarGerenciadorDocumentosCVM?tipoFundo=1'
          html=sess.get(url,timeout=90).text
          pathlib.Path('out/page.html').write_text(html,encoding='utf-8')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          found=[]
          for i,src in enumerate(srcs):
            u=urllib.parse.urljoin(url,src)
            try:
              r=sess.get(u,timeout=90)
              txt=r.text
              pathlib.Path(f'out/js/{i:02d}.js').write_text(txt,encoding='utf-8',errors='ignore')
              for m in re.finditer(r'[^\n]{0,180}(?:fundo|Fundo|autocomplete|pesquisar|listar|cnpj)[^\n]{0,260}',txt,re.I):
                line=m.group(0)
                if '/fnet/' in line or 'publico' in line or '$.ajax' in line or 'url' in line.lower():
                  found.append({'script':u,'text':line[:500]})
            except Exception as e:
              found.append({'script':u,'error':str(e)})
          pathlib.Path('out/endpoints.json').write_text(json.dumps({'scripts':srcs,'matches':found},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          sha256sum out/page.html out/endpoints.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fnet-identity-endpoint-audit
          path: out
          retention-days: 1
