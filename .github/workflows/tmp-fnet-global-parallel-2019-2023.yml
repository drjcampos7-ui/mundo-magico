name: tmp-fnet-global-parallel-2019-2023
on:
  push:
    branches: [tmp-fnet-fii-bridge]
permissions:
  contents: read
jobs:
  quarter:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {y: 2019, q: 1}
          - {y: 2019, q: 2}
          - {y: 2019, q: 3}
          - {y: 2019, q: 4}
          - {y: 2020, q: 1}
          - {y: 2020, q: 2}
          - {y: 2020, q: 3}
          - {y: 2020, q: 4}
          - {y: 2021, q: 1}
          - {y: 2021, q: 2}
          - {y: 2021, q: 3}
          - {y: 2021, q: 4}
          - {y: 2022, q: 1}
          - {y: 2022, q: 2}
          - {y: 2022, q: 3}
          - {y: 2022, q: 4}
          - {y: 2023, q: 1}
          - {y: 2023, q: 2}
          - {y: 2023, q: 3}
          - {y: 2023, q: 4}
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate one quarter globally
        env:
          YEAR: ${{ matrix.y }}
          QUARTER: ${{ matrix.q }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,time,datetime,calendar,pathlib,os
          y=int(os.environ['YEAR']); q=int(os.environ['QUARTER']); L=50
          m=1+(q-1)*3; lm=m+2
          di=datetime.date(y,m,1).strftime('%d/%m/%Y')
          df=datetime.date(y,lm,calendar.monthrange(y,lm)[1]).strftime('%d/%m/%Y')
          base='https://fnet.bmfbovespa.com.br/fnet/publico/pesquisarGerenciadorDocumentosDados'
          common=dict(d=0,l=L,tipoFundo=1,administrador='',idFundo='',idCategoriaDocumento=0,idTipoDocumento=0,idEspecieDocumento=0,situacao='',cnpj='',cnpjFundo='',dataReferencia='',dataInicial=di,dataFinal=df,idModalidade='',palavraChave='')
          def get(p):
            last=None
            for k in range(8):
              try:
                r=requests.get(base,params=p,timeout=(15,90)); r.raise_for_status(); return r.json()
              except Exception as e:
                last=e; time.sleep(min(2**k,30))
            raise RuntimeError(last)
          s=0; total=None; rows=[]; pages=0
          while total is None or s<total:
            p=dict(common); p['s']=s
            j=get(p); pages+=1
            if total is None: total=int(j.get('recordsFiltered') or 0)
            batch=j.get('data') or []; rows.extend(batch)
            if not batch: break
            s += len(batch)
          complete=len(rows)==total
          fr=[r for r in rows if str(r.get('categoriaDocumento','')).strip()=='Fato Relevante' and str(r.get('situacaoDocumento','')).strip()=='A']
          out={'year':y,'quarter':q,'dataInicial':di,'dataFinal':df,'recordsFiltered':total,'rows_collected':len(rows),'pages':pages,'complete':complete,'fato_relevante_active_count':len(fr),'fato_relevante_rows':fr}
          pathlib.Path(f'out/{y}Q{q}.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          if not complete: raise SystemExit('INCOMPLETE')
          PY
          sha256sum out/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fnet-quarter-${{ matrix.y }}Q${{ matrix.q }}
          path: out
          retention-days: 1
  combine:
    needs: quarter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fnet-quarter-*
          path: quarters
          merge-multiple: true
      - name: Verify and combine
        run: |
          set -euo pipefail
          mkdir -p final
          python - <<'PY'
          import json,glob,pathlib
          files=sorted(glob.glob('quarters/*Q*.json'))
          rows=[json.load(open(f,encoding='utf-8')) for f in files]
          assert len(rows)==20, len(rows)
          assert all(r.get('complete') for r in rows)
          assert len({(r['year'],r['quarter']) for r in rows})==20
          rows.sort(key=lambda r:(r['year'],r['quarter']))
          pathlib.Path('final/fnet_global_fatos_relevantes_2019_2023.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          summary=[{k:r.get(k) for k in ['year','quarter','recordsFiltered','rows_collected','pages','complete','fato_relevante_active_count']} for r in rows]
          pathlib.Path('final/completeness.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          sha256sum final/*.json > final/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fnet-global-fii-2019-2023-parallel-complete
          path: final
          retention-days: 1
